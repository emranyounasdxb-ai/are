name: ARE CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: are_ci
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: are_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U are_ci -d are_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ARE_DATABASE_URL: postgresql+asyncpg://are_ci@127.0.0.1:5432/are_ci
      ARE_REDIS_URL: redis://127.0.0.1:6379/0
      ARE_ENVIRONMENT: test
      ARE_SESSION_COOKIE_SECURE: false
      ARE_CORS_ORIGINS: http://127.0.0.1:50001,http://127.0.0.1:50002
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.11"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install backend dependencies
        working-directory: services/api
        run: python -m pip install ".[dev]"

      - name: Backend format and lint
        working-directory: services/api
        run: |
          ruff format --check .
          ruff check .

      - name: Backend type-check
        working-directory: services/api
        run: mypy app

      - name: Migration lifecycle
        working-directory: services/api
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Backend tests
        working-directory: services/api
        run: pytest

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Private font boundary and binary-free validation tests
        run: |
          node apps/public-web/scripts/check-public-font-boundary.mjs
          npm run test:fonts --workspace=@are/public-web

      - name: Type-check
        run: npm run typecheck

      - name: Code-only build (commercial typography NOT verified)
        env:
          ARE_FONT_BUILD_MODE: code-only
        run: npm run build

      - name: Record typography verification boundary
        run: echo "Code-only CI passed. No commercial fonts were retrieved. Actual typography requires the owner-controlled runtime and local visual checks." >> "$GITHUB_STEP_SUMMARY"
